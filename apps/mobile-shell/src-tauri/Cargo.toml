[package]
name = "jianying-mobile-shell"
version = "0.1.0"
description = "Native iOS and Android capability shell for Jianying Auto Editor"
authors = ["Jianying Auto Editor"]
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "lib", "staticlib"]
name = "jianying_mobile_shell"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
futures-util = { version = "0.3.31", default-features = false, features = ["sink"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
tauri = "2.11.5"
tauri-plugin-dialog = "2.7.2"
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["macros", "sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1.41"
url = "2.5.8"

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }
tempfile = "3.23.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
elided_lifetimes_in_paths = "warn"
non_ascii_idents = "deny"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# This private local-first application is not intended for crates.io publication.
cargo_common_metadata = "allow"
# Tauri's platform integrations deliberately retain incompatible transitive versions across targets.
multiple_crate_versions = "allow"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
mem_forget = "deny"
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
as_underscore = "deny"
as_ptr_cast_mut = "deny"
ptr_as_ptr = "warn"
borrow_as_ptr = "warn"
fn_to_numeric_cast_any = "deny"
clone_on_ref_ptr = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
exit = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
use_debug = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
mod_module_files = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
empty_enum = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = "line-tables-only"

[profile.dev]
opt-level = 0
debug = true
incremental = true
codegen-units = 256
split-debuginfo = "unpacked"
